<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blackwall Optik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Full-bleed CRT stage: the ASCII canvas is the whole page, a thin HUD floats over it. Single dark look by design. */
:root{
  --void:#040507;
  --phosphor:#c9d3dc;
  --dim:#5d6672;
  --ice:#4ff0e4;
  --wall:#ff2a44;
  --line:rgba(201,211,220,.16);
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hud:"Chakra Petch", "JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--phosphor);overflow:hidden;font-family:var(--hud)}
#stage{position:fixed;inset:0;background:var(--void)}
#cv{display:block;width:100%;height:100%}
/* CRT: scanlines + vignette + faint flicker */
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px);mix-blend-mode:multiply}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.72) 100%);
  animation:flick 4s steps(40) infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.93}48%{opacity:1}73%{opacity:.96}}
.hud{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.top{top:0;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px}
.bot{bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(4,5,7,.85),rgba(4,5,7,0))}
.brand{color:var(--phosphor);font-weight:600}
.brand b{color:var(--wall);font-weight:600}
#tc{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.phases{display:flex;gap:4px;flex-wrap:wrap;pointer-events:auto}
.ctrl{display:flex;gap:6px;pointer-events:auto}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--dim);background:rgba(4,5,7,.55);
  border:1px solid var(--line);padding:6px 10px;cursor:pointer;border-radius:0}
button:hover{color:var(--phosphor);border-color:rgba(201,211,220,.4)}
button:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.ph[aria-current="true"]{color:var(--ice);border-color:var(--ice)}
.ph.red[aria-current="true"]{color:var(--wall);border-color:var(--wall)}
.ph span{opacity:.55;margin-right:6px}
@media (max-width:520px){.hud{font-size:10px;letter-spacing:.1em}button{padding:5px 7px}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="ASCII animasyon: bir göz, kamera gözbebeğine dalıyor ve Blackwall'a ulaşıyor" role="img"></canvas></div>

<div class="hud top">
  <div class="brand">OPTİK // <b>BLACKWALL</b></div>
  <div id="tc">T+00.00 / 30.00</div>
</div>
<div class="hud bot">
  <div class="phases" id="phases">
    <button class="ph" data-t="0"><span>01</span>Göz</button>
    <button class="ph" data-t="6.8"><span>02</span>Dalış</button>
    <button class="ph red" data-t="10.2"><span>03</span>İhlal</button>
    <button class="ph red" data-t="13.5"><span>04</span>Blackwall</button>
  </div>
  <div class="ctrl">
    <button id="play">Durdur</button>
    <button id="restart">Baştan</button>
  </div>
</div>

<script>
(()=>{
const MONO='"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const LOOP=30;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const glow=document.createElement('canvas'), gctx=glow.getContext('2d');
const hasFilter=('filter' in gctx);

/* ---------- math ---------- */
const TAU=Math.PI*2;
const fract=x=>x-Math.floor(x);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const h2=(x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453);
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

/* ---------- palette: hue x level buckets ---------- */
const HUES=[ // 0 phosphor, 1 ice, 2 wall red, 3 hot
  [[24,28,36],[232,236,242]],
  [[5,36,42],[150,255,246]],
  [[46,2,10],[255,44,66]],
  [[255,86,108],[255,242,244]]];
const COL=[];
for(let h=0;h<4;h++)for(let l=0;l<8;l++){const k=Math.pow(l/7,1.15),[a,b]=HUES[h];
  COL[h*8+l]=`rgb(${Math.round(a[0]+(b[0]-a[0])*k)},${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)})`;}

const RAMP=" .'`:-~=+*xo#%@", RL=RAMP.length;
const RAIN="01<>/\\|{}[]#$%&*+=:;!?ABCDEF";
const DATA="0123456789ABCDEF<>/{}#$%&";
const rc=b=>RAMP[clamp(Math.floor(b*RL),0,RL-1)];
const DIRS=['-','\\','|','/'];
const dirChar=th=>DIRS[((Math.round(th/(Math.PI/4))%4)+4)%4];

/* ---------- grid ---------- */
let W,H,FS,cw,ch,cols,rows,CH,BK,lines,stamp,stampId=0,GAIN=1;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  FS=W<600?9:(W<1100?11:12);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font=`500 ${FS}px ${MONO}`;
  cw=ctx.measureText('M').width;ch=Math.round(FS*1.2);
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
  CH=new Array(cols*rows).fill(' ');BK=new Uint8Array(cols*rows);
  lines=[];for(let b=0;b<32;b++)lines.push(new Array(cols).fill(' '));
  stamp=new Int32Array(32);
  glow.width=Math.max(1,Math.ceil(W/3));glow.height=Math.max(1,Math.ceil(H/3));
}
function put(i,c,hue,b){b*=GAIN;
  if(b<=0.04||c===' '){BK[i]=0;CH[i]=' ';return;}
  let l=1+Math.floor(Math.min(.999,b)*7);if(l>7)l=7;BK[i]=hue*8+l;CH[i]=c;}
function setc(r,c,chr,hue,b){if(r<0||r>=rows||c<0||c>=cols)return;put(r*cols+c,chr,hue,b);}
function text(r,c,s,hue,b){for(let k=0;k<s.length;k++)setc(r,c+k,s[k],hue,s[k]===' '?0:b);}

/* ---------- eye ---------- */
const lidU=(x,o)=>-0.5*o*Math.pow(Math.max(0,1-x*x),0.85)+0.04*x*o;
const lidL=(x,o)=>0.36*o*Math.pow(Math.max(0,1-x*x),1.1)+0.02*x*o;
// returns 0 = outside, 1 = drawn, 2 = inside pupil
function eyeCell(i,c,x,y,E){
  const ax=Math.abs(x);if(ax>=1)return 0;
  const o=E.o,q=1-x*x,yu=lidU(x,o),yl=lidL(x,o),ew=E.ew;
  if(o>0.02&&(Math.abs(y-yu)<ew||Math.abs(y-yl)<ew)){
    const up=Math.abs(y-yu)<ew,f=up?lidU:lidL;
    const sl=(f(x+.02,o)-f(x-.02,o))/.04;
    const chr=Math.abs(sl)<.35?(up&&ax<.6?'=':'-'):(sl>0?'\\':'/');
    put(i,chr,E.lidHue,up?.9:.7);return 1;}
  if(y<yu){
    const lashOn=h2(c,7)<.55,lashL=(.05+.1*h2(c,3))*q*o;
    if(lashOn&&o>.15&&y>yu-lashL){put(i,x<-.3?'\\':x>.3?'/':'|',E.lidHue,.55);return 1;}
    const cr=yu-.2*q*o-.05;
    if(o>.3&&Math.abs(y-cr)<ew*.7){put(i,'_',0,.26);return 1;}
    return 0;}
  if(y>yl)return 0;
  const dx=x-E.gx,dy=y-E.gy,d=Math.hypot(dx,dy);
  if(E.hl>0){
    if(Math.hypot(dx+.1,dy+.1)<.045){put(i,'@',3,.95*E.hl);return 1;}
    if(Math.hypot(dx-.08,dy-.07)<.02){put(i,'o',3,.7*E.hl);return 1;}}
  const pd=Math.sqrt((dx/E.px)**2+(dy/E.py)**2);
  if(pd<1)return 2;
  if(d<E.R){
    const a=Math.atan2(dy,dx);
    const ringR=E.R*.66;
    if(Math.abs(d-ringR)<ew*.55){const seg=fract((a+E.t*.9)/TAU*18);
      if(seg<.55){put(i,dirChar(a+Math.PI/2),E.ringHue,.92);return 1;}}
    const n1=vnoise(a*5+10,d*14-E.t*.2);
    const st=.5+.5*Math.sin(a*34+n1*5);
    let b=.26+.44*st*(.6+.4*n1)+.15*n1;
    b*=1-.65*smooth(E.R*.78,E.R,d);
    if(pd<1.4)b+=.3*(1-(pd-1)/.4);
    put(i,st>.8&&b>.5?dirChar(a):rc(b),E.irisHue,b);return 1;}
  const vn=vnoise(x*11+3,y*11);
  if(ax>.42&&Math.abs(vn-.5)<.032){put(i,'~',E.veinHue,.4);return 1;}
  const sh=smooth(0,.22,y-yu)*(1-.55*x*x);
  const b=(.16+.5*sh)*E.scleraB;
  put(i,rc(b*.8),E.scleraHue,b);return 1;
}

const GK=[[0,0,0],[2.2,0,0],[2.55,-.34,.04],[3.35,-.34,.04],[3.7,.36,-.05],[4.7,.36,-.05],[5.1,0,0]];
function gazeAt(t){for(let k=0;k<GK.length-1;k++){const a=GK[k],b=GK[k+1];
  if(t<b[0]){const u=smooth(0,1,(t-a[0])/(b[0]-a[0]));return[a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}}return[0,0];}
function openness(t){let o=smooth(.3,1.5,t);
  if(t>3.38&&t<3.74)o*=1-.96*Math.sin(Math.PI*(t-3.38)/.36);
  return o*(1+.12*smooth(5.4,6,t));}
const pupilR=t=>.13-.02*smooth(.6,1.8,t)+.07*smooth(5.5,6.3,t);

/* ---------- tunnel ---------- */
function tunnelCell(i,dx,dy,t,f){
  const M=Math.min(W,H)*.5,rn=Math.hypot(dx,dy)/M+1e-4,a=Math.atan2(dy,dx);
  const tau=Math.max(0,t-6.8),travel=1.2*tau+.35*tau*tau;
  const zz=.55/(rn+.04)+travel,tw=a+zz*.12+t*.25;
  const ring=fract(zz*.9),spk=fract(tw/TAU*14),fog=smooth(.02,.45,rn);
  let b,chr;
  if(ring<.1){b=.9*fog;chr=dirChar(a+Math.PI/2);}
  else if(spk<.07){b=.6*fog;chr=dirChar(a);}
  else{const blk=h2(Math.floor(zz*.9),Math.floor(fract(tw/TAU)*28));
    if(blk>.86){b=.38*fog;chr=DATA[Math.floor(h2(i,Math.floor(t*15))*DATA.length)];}
    else{b=.12*fog*vnoise(a*6,zz);chr='.';}}
  const red=smooth(9.3,12.2,t);
  let hue=h2(i,77)<red?2:1;
  const core=red*(1-smooth(0,.22+.18*red,rn))*(.85+.15*Math.sin(t*20));
  if(core>b){b=core;chr=rc(core);hue=core>.75?3:2;}
  put(i,chr,hue,b*f);
}

/* ---------- scenes ---------- */
function sceneEye(t){
  GAIN=smooth(0,.6,t);
  let g=gazeAt(t);
  if(t<5.1)g=[g[0]+.012*(vnoise(t*3,1)-.5),g[1]+.012*(vnoise(t*3,9)-.5)];
  const o=openness(t),p=pupilR(t);
  const z=t<6.8?1:Math.exp(.9*Math.pow(t-6.8,1.6));
  const U=Math.min(W*.42,H*.8);
  const E={o,gx:g[0],gy:g[1],px:p,py:p,R:.36,ew:ch*.55/(U*z),t,hl:1-smooth(7,7.5,t),
    irisHue:1,ringHue:0,lidHue:0,scleraHue:0,scleraB:1,veinHue:2};
  const tunF=smooth(6.9,8.6,t);
  const pcx=g[0]*U,pcy=g[1]*U;
  const covered=p*U*z>Math.hypot(W,H)*.56;
  for(let r=0;r<rows;r++){const py=(r+.5)*ch-H/2;
    for(let c=0;c<cols;c++){const i=r*cols+c,px=(c+.5)*cw-W/2;
      if(covered){tunnelCell(i,px-pcx,py-pcy,t,1);continue;}
      const x=g[0]+(px/U-g[0])/z,y=g[1]+(py/U-g[1])/z;
      const res=eyeCell(i,c,x,y,E);
      if(res===2){if(tunF>0)tunnelCell(i,px-pcx,py-pcy,t,tunF);else put(i,' ',0,0);continue;}
      if(res===1)continue;
      // skin
      const yb=-.8+.32*x*x;
      if(Math.abs(y-yb)<.045&&Math.abs(x)<1.15){put(i,'~',0,.3);continue;}
      const b=.05+.16*vnoise(x*5,y*5+t*.1);
      put(i,rc(b),0,b);
    }}
  // target lock reticle
  if(t>5.3&&t<7.6&&(t>5.75||Math.floor(t*12)%2===0)){
    const hw=.43*U*z,hh=hw*.86;
    const cl=Math.round((pcx-hw+W/2)/cw),cr=Math.round((pcx+hw+W/2)/cw);
    const rt=Math.round((pcy-hh+H/2)/ch),rb=Math.round((pcy+hh+H/2)/ch);
    const hue=3,b=.95;
    text(rt,cl,'+--',hue,b);setc(rt+1,cl,'|',hue,b);
    text(rt,cr-2,'--+',hue,b);setc(rt+1,cr,'|',hue,b);
    text(rb,cl,'+--',hue,b);setc(rb-1,cl,'|',hue,b);
    text(rb,cr-2,'--+',hue,b);setc(rb-1,cr,'|',hue,b);
    text(rt-1,cl,' TARGET LOCK :: '+(t>5.95?'IRIS 0x3F ACQUIRED ':'SCANNING... '),hue,.85);
  }
  if(t>.4&&t<6.4){const s='> OPTIC FEED :: LINK ESTABLISHED';
    text(1,2,s.slice(0,Math.floor((t-.4)*28)),0,.45);}
}

function sceneFlash(t){
  const w=(t-13)/.5;GAIN=1;
  const fr=Math.floor(t*30);
  for(let i=0;i<cols*rows;i++){
    if(h2(i,fr)<1-w*.75)put(i,"#@%&"[Math.floor(h2(i,fr+3)*4)],w<.35?3:2,1-w*.7);
    else put(i,' ',0,0);}
}

const FONT={
 B:["11110","10001","10001","11110","10001","10001","11110"],
 L:["10000","10000","10000","10000","10000","10000","11111"],
 A:["01110","10001","10001","11111","10001","10001","10001"],
 C:["01111","10000","10000","10000","10000","10000","01111"],
 K:["10001","10010","10100","11000","10100","10010","10001"],
 W:["10001","10001","10001","10101","10101","10101","01010"]};
const TITLE="BLACKWALL";
function titleOn(fx,fy){const L=Math.floor(fx/6),k=fx%6;if(k===5||L>=TITLE.length)return false;
  return FONT[TITLE[L]][fy][k]==='1';}

const MSGS=[];

function sceneWall(t){
  const w=t-13.5;
  GAIN=1-smooth(28.8,29.5,t);
  const M=Math.min(W,H)*.5;
  const bp=fract(w*1.15);
  const beat=Math.exp(-bp*7)+(bp>.18?.5*Math.exp(-(bp-.18)*9):0);
  const pulse=.8+.25*beat;
  const reveal=w*1.8;
  const bx=[],by=[];
  for(let k=0;k<4;k++){bx.push(Math.sin(t*.31+k*1.7)*.9*(W/H>1?W/H:1));by.push(Math.cos(t*.23+k*2.3)*.7);}
  // red eye opening in the wall
  const eyeOn=t>24.5;
  let E=null,U2=0;
  if(eyeOn){
    U2=Math.min(W*.46,H*.85)*(1+.15*smooth(26,29,t));
    let o=smooth(24.6,26,t);
    if(t>27&&t<27.25)o*=1-.85*Math.sin(Math.PI*(t-27)/.25);
    const k=smooth(28.3,29.3,t);
    E={o,gx:.01*(vnoise(t*2,4)-.5),gy:0,px:.035+k*3,py:.3+k*3,R:.42,ew:ch*.55/U2,t,hl:1-k,
      irisHue:2,ringHue:3,lidHue:3,scleraHue:2,scleraB:.38,veinHue:3};
  }
  for(let c=0;c<cols;c++){
    const sp=8+h2(c,1)*18,trail=6+h2(c,2)*18,Lp=rows+trail+h2(c,3)*rows;
    const head=(w*sp+h2(c,4)*500)%Lp;
    for(let r=0;r<rows;r++){
      const i=r*cols+c,px=(c+.5)*cw-W/2,py=(r+.5)*ch-H/2,nx=px/M,ny=py/M;
      if(Math.abs(ny)>reveal){put(i,' ',0,0);continue;}
      if(E){const res=eyeCell(i,c,px/U2,py/U2,E);
        if(res===1)continue;if(res===2){put(i,' ',0,0);continue;}}
      const n=vnoise(nx*2.2,ny*2.2-w*.25);
      const cellv=Math.abs(Math.sin((nx+n*.5)*7)*Math.sin((ny-n*.5)*7+w*.4));
      const edge=1-smooth(0,.18,cellv);
      let mb=(.08+.32*edge)*(.7+.6*n)*pulse;
      let fld=0;for(let k=0;k<4;k++){const ddx=nx-bx[k],ddy=ny-by[k];fld+=.045/(ddx*ddx+ddy*ddy+.002);}
      const blob=fld>1;
      if(blob)mb+=.28*Math.min(1,(fld-1)*.6);
      const dd=head-r;
      if(dd>=0&&dd<trail){
        const rb=(1-dd/trail)*.95*pulse;
        if(rb>mb){const hot=dd<1;
          put(i,RAIN[Math.floor(h2(i,Math.floor(w*(hot?20:6)))*RAIN.length)],hot?3:2,hot?1:rb);continue;}}
      const chr=blob&&mb>.35?"%#@"[Math.floor(h2(i,Math.floor(w*4))*3)]:rc(mb);
      put(i,chr,2,mb);
    }}

  // title
  if(t>15&&t<24.4){
    const sx=Math.max(1,Math.floor(cols*.82/53)),sy=Math.max(1,Math.round(sx*cw*1.25/ch));
    const c0=Math.floor((cols-53*sx)/2),r0=Math.floor(rows*.4-7*sy/2);
    const prog=smooth(15,17.5,t)*1.25,out=smooth(23.6,24.4,t),fr=Math.floor(t*18);
    for(let pass=0;pass<2;pass++)
    for(let fy=0;fy<7;fy++)for(let fx=0;fx<53;fx++){if(!titleOn(fx,fy))continue;
      for(let a=0;a<sy;a++)for(let b=0;b<sx;b++){
        const r=r0+fy*sy+a,c=c0+fx*sx+b,key=r*1000+c;
        const hv=h2(key,5);if(hv>prog||h2(key,9)<out)continue;
        if(pass===0){setc(r+1,c+1,':',2,.5);continue;}
        const settling=hv>prog-.18;
        setc(r,c,settling?RAIN[Math.floor(h2(key,fr)*RAIN.length)]:(fy===0||a===0?'#':'@'),3,settling?.8:1);
      }}
  }
  // terminal log
  const base=rows-Math.ceil(78/ch)-MSGS.length;
  MSGS.forEach(([st,s],k)=>{if(t<st)return;
    let str=s.slice(0,Math.floor((t-st)*40)).slice(0,cols-4);
    if(k===4){str=str.split('').map((ch2,j)=>h2(j,Math.floor(t*10))<.12?RAIN[Math.floor(h2(j,Math.floor(t*30))*RAIN.length)]:ch2).join('');}
    const latest=k===MSGS.length-1||t<MSGS[k+1][0];
    const cur=latest&&Math.floor(t*3)%2===0?'_':'';
    text(base+k,2,' '+str+cur+' ',latest?3:2,latest?1:.8);
  });
}

/* ---------- glitch tears (post) ---------- */
const BURSTS=[[3.42,3.6,.1],[13.5,14.2,.35],[19.6,20.1,.25],[22.4,23.1,.3],[24.2,24.6,.4],[28.9,29.5,.3]];
function glitchAmt(t){let g=0;
  if(t>11.5&&t<13)g=.18*smooth(11.5,13,t);
  if(t>=13&&t<13.5)g=.5;
  if(t>=13.5)g=.015;
  for(const[a,b,v]of BURSTS)if(t>a&&t<b)g=Math.max(g,v*Math.sin(Math.PI*(t-a)/(b-a)));
  return g;}
const tmpC=[],tmpB=[];
function tears(t){const g=glitchAmt(t);if(g<=0)return;const fr=Math.floor(t*14);
  for(let r=0;r<rows;r++){const band=Math.floor(r/2);
    if(h2(band,fr)>=g)continue;
    const off=Math.round((h2(band+31,fr)-.5)*cols*.25);if(!off)continue;
    const s=r*cols;
    for(let c=0;c<cols;c++){tmpC[c]=CH[s+c];tmpB[c]=BK[s+c];}
    for(let c=0;c<cols;c++){const src=((c-off)%cols+cols)%cols;CH[s+c]=tmpC[src];BK[s+c]=tmpB[src];}
  }}

/* ---------- render ---------- */
function render(t){
  if(t<13)sceneEye(t);else if(t<13.5)sceneFlash(t);else sceneWall(t);
  tears(t);
  ctx.fillStyle='#040507';ctx.fillRect(0,0,W,H);
  ctx.font=`500 ${FS}px ${MONO}`;ctx.textBaseline='top';
  for(let r=0;r<rows;r++){stampId++;const used=[];const s=r*cols;
    for(let c=0;c<cols;c++){const b=BK[s+c];if(!b)continue;
      if(stamp[b]!==stampId){stamp[b]=stampId;lines[b].fill(' ');used.push(b);}
      lines[b][c]=CH[s+c];}
    for(const b of used){ctx.fillStyle=COL[b];ctx.fillText(lines[b].join(''),0,r*ch);}
  }
  // bloom
  gctx.clearRect(0,0,glow.width,glow.height);
  if(hasFilter)gctx.filter='blur(3px)';
  gctx.drawImage(cv,0,0,glow.width,glow.height);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=hasFilter?.6:.3;
  ctx.drawImage(glow,0,0,cv.width,cv.height);ctx.restore();
}

/* ---------- loop + HUD ---------- */
const tc=document.getElementById('tc'),playBtn=document.getElementById('play');
const phBtns=[...document.querySelectorAll('.ph')];
let t=0,playing=true,last=performance.now();
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){t=17.5;playing=false;}
function hud(){tc.textContent='T+'+t.toFixed(2).padStart(5,'0')+' / '+LOOP.toFixed(2);
  let a=0;phBtns.forEach((b,k)=>{if(t>=+b.dataset.t)a=k;});
  phBtns.forEach((b,k)=>b.setAttribute('aria-current',k===a?'true':'false'));
  playBtn.textContent=playing?'Durdur':'Oynat';}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!document.hidden){t+=dt;if(t>=LOOP)t-=LOOP;}
  render(t);hud();requestAnimationFrame(frame);}
phBtns.forEach(b=>b.addEventListener('click',()=>{t=+b.dataset.t;}));
playBtn.addEventListener('click',()=>{playing=!playing;});
document.getElementById('restart').addEventListener('click',()=>{t=0;playing=true;});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playing=!playing;}});
addEventListener('resize',resize);
resize();
if(document.fonts&&document.fonts.load){document.fonts.load(`500 12px "JetBrains Mono"`).then(resize).catch(()=>{});}
requestAnimationFrame(frame);
})();
</script>
